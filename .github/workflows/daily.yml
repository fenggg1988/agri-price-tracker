# schedule re-registered 2026-09-26 (fix: cron lost after account flag)
name: Daily AgriChem Price Scrape

on:
  schedule:
    # 09:00 Beijing time (UTC+8) == 01:00 UTC
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      chain:
        description: "内部使用：链式调度传来的标记，勿手动填写"
        required: false
        default: "0"

permissions:
  contents: write
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run scraper
        run: python scrape_agri_prices.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/agri_prices.json data/agri_prices.csv agri_prices.html index.html agri_prices.png
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: daily agrichem price update $(date -u +%F)"
            git pull --rebase --autostash origin "$(git branch --show-current)" || true
            git push
          fi

      # 兜底：schedule 不可靠（GitHub 免费版常延迟数小时）。
      # 注意：GITHUB_TOKEN 无法触发 workflow_dispatch（防递归），必须用 PAT(CHAIN_TOKEN)。
      # 每次成功后主动触发下一个项目，形成自链式调度。
      - name: Trigger next project (chain)
        if: success() && github.event.inputs.chain != '1'
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.CHAIN_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository_owner }}/openrouter-model-tracker/actions/workflows/daily-scrape.yml/dispatches \
            -d '{"ref":"main","inputs":{"chain":"1"}}' || true
