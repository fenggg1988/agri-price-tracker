name: Daily AgriChem Price Scrape

on:
  schedule:
    # 09:00 Beijing time (UTC+8) == 01:00 UTC
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run scraper
        run: python scrape_agri_prices.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/agri_prices.json data/agri_prices.csv agri_prices.html index.html agri_prices.png
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: daily agrichem price update $(date -u +%F)"
            git push
          fi
